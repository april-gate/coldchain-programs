[package]
name = "device-registry"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "device_registry"        # was: coldchain_program

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
# SHA-256 (hashv) for the on-chain integrity hash chain. Anchor 0.32 no longer
# re-exports a `hash` module under `solana_program`, so the hasher is pulled in
# directly. Pinned to the version already resolved transitively.
solana-sha256-hasher = "2.3.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
